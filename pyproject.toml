[project]
name = 'dici-open'
version = '0.1.0b1'
description = 'DICIO (Dici Open), a lightweight terminal dictionary.'
license = 'MIT'

authors = [{name = 'oJohnnyMarcello', email = 'Bookman.Archive@gmail.com'}]
readme = {file = 'README.md', content-type = 'text/markdown'}
requires-python = '>= 3.15'

dependencies = [
    'rich==15.0.0',
    'prompt_toolkit==3.0.53',
    'requests==2.34.2'
]

keywords = ['dictionary', 'cli', 'portuguese', 'jisho', 'terminal']
classifiers = [
  'Development Status :: 4 - Beta',
  'Environment :: Console',
  'Programming Language :: Python :: 3',
  'Programming Language :: Python :: 3.15',
  'Topic :: Education',
  'Topic :: Utilities'
]

[project.urls]
Homepage = 'https://github.com/oJohnnyBoy/Dicio'
Repository = 'https://github.com/oJohnnyBoy/Dicio'

[project.scripts]
dicio = 'dici.main:run'

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ['setuptools>=84.2.1']
build-backend = 'setuptools.build_meta'