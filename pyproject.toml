[project]
name = 'dici-open'
version = '0.0.0a1'
description = 'A lightweight terminal dictionary tool for quick word lookups.'
license = 'MIT'

authors = [{name = 'oJohnnyMarcello', email = 'Bookman.Archive@gmail.com'}]
readme = {file = 'README.md', content-type = 'text/markdown'}
requires-python = '>= 3.15'

dependencies = [
    'rich<15.0.0',
    'prompt_toolkit==3.0.53',
    'requests==2.34.2'
]

keywords = ['dictionary', 'cli', 'portuguese', 'jisho', 'terminal']
classifiers = [
  'Development Status :: 3 - Alpha',
  'Environment :: Console',
  'Programming Language :: Python :: 3',
  'Programming Language :: Python :: 3.15',
  'Topic :: Education',
  'Topic :: Utilities'
]

[project.urls]
Homepage = 'https://github.com/oJohnnyBoy/Dicio'
Repository = 'https://github.com/oJohnnyBoy/Dicio'

[project.scripts]
dici = 'dici.main:main'

[build-system]
requires = ['setuptools>=84.2.1']
build-backend = 'setuptools.build_meta'